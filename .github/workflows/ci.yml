name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  check:
    name: guard, typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm guard
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  forge:
    name: forge (pytest, ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ffmpeg: optional FLAC fixture copies; libsndfile1: soundfile; build-essential: madmom.
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1 build-essential

      - name: Install uv
        run: pipx install uv

      - run: uv sync --project tools/forge --locked
      - run: uv run --project tools/forge ruff check tools/forge
      - run: uv run --project tools/forge pytest tools/forge

  e2e:
    name: e2e (Playwright)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # CI only: local and cloud sessions use the pre-installed browser (see docs/TESTING.md).
      - name: Install Playwright Chromium
        run: pnpm --filter @stemdeck/e2e exec playwright install --with-deps chromium

      - run: pnpm e2e -- --trace off

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
